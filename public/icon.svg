<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.3" stroke-dasharray="12 12" />

  <!-- Core AI Orb -->
  <circle cx="256" cy="256" r="100" fill="url(#orbGrad)" filter="url(#glow)" />

  <!-- Android AI Waveform Lines -->
  <path d="M 180 256 Q 218 200, 256 256 T 332 256" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 196 256 Q 226 290, 256 256 T 316 256" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Sparkle dots -->
  <circle cx="340" cy="170" r="8" fill="#67e8f9" filter="url(#glow)" />
  <circle cx="170" cy="340" r="6" fill="#34d399" filter="url(#glow)" />
  <circle cx="350" cy="330" r="5" fill="#60a5fa" filter="url(#glow)" />
</svg>
