name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android Project Structure
        run: |
          echo "=== Checking Android Project Structure ==="
          if [ ! -d "android" ]; then
            echo "::error::Android directory 'android/' not found!"
            exit 1
          fi

          if [ ! -f "android/build.gradle.kts" ] && [ ! -f "android/build.gradle" ]; then
            echo "::error::Root android build.gradle(.kts) not found in 'android/'!"
            exit 1
          fi

          if [ ! -f "android/settings.gradle.kts" ] && [ ! -f "android/settings.gradle" ]; then
            echo "::error::Android settings.gradle(.kts) not found in 'android/'!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found in 'android/app/src/main/'!"
            exit 1
          fi

          echo "✅ Android project structure verified."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradlew Executable
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "::warning::gradlew not found, ensuring gradle executable wrapper"
          fi

      - name: Build Android Debug APK
        id: gradle_build
        run: |
          cd android
          echo "=== Starting Gradle Debug Build ==="
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --scan --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --scan --no-daemon
          fi

      - name: Discover and Validate Generated APK
        id: apk_discovery
        run: |
          echo "=== Locating Generated APK ==="
          APK_FILES=$(find android -type f -path "*/build/outputs/apk/*/*.apk")

          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files found in android/**/build/outputs/apk/*/*.apk!"
            exit 1
          fi

          echo "Found APK files:"
          echo "$APK_FILES"

          # Target debug APK specifically
          PRIMARY_APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(echo "$APK_FILES" | head -n 1)
          fi

          if [ ! -f "$PRIMARY_APK" ]; then
            echo "::error::Target APK $PRIMARY_APK does not exist!"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$PRIMARY_APK" 2>/dev/null || stat -f%z "$PRIMARY_APK" 2>/dev/null || echo "0")
          if [ "$APK_SIZE" -le 0 ]; then
            echo "::error::Generated APK has invalid size: $APK_SIZE bytes!"
            exit 1
          fi

          echo "Primary APK located: $PRIMARY_APK ($APK_SIZE bytes)"

          # Copy to predictable artifact name
          TARGET_DIR="android/app/build/outputs/apk/debug"
          mkdir -p "$TARGET_DIR"
          cp "$PRIMARY_APK" "$TARGET_DIR/Jarvis7-debug.apk"

          echo "apk_path=$TARGET_DIR/Jarvis7-debug.apk" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_filename=Jarvis7-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis7-debug-apk
          path: android/app/build/outputs/apk/debug/Jarvis7-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary Report
        if: always()
        run: |
          APK_STATUS="${{ steps.gradle_build.outcome == 'success' && steps.apk_discovery.outcome == 'success' && 'SUCCESS' || 'FAILED' }}"
          
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 🚀 JARVIS7 ANDROID BUILD

          | Parameter | Value |
          |:---|:---|
          | **Build Status** | **${{ steps.gradle_build.outcome == 'success' && steps.apk_discovery.outcome == 'success' && '✅ SUCCESS' || '❌ FAILED' }}** |
          | **Repository** | `Sajjat4/Jarvis7` |
          | **Android Project** | `android/` |
          | **Build Type** | `Debug` |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Ref / Branch** | `${{ github.ref_name }}` |
          | **APK File** | `Jarvis7-debug.apk` |
          | **Artifact Name** | `Jarvis7-debug-apk` |
          | **APK Size** | `${{ steps.apk_discovery.outputs.apk_size }} bytes` |
          
          ---
          
          ### 📱 How to install on your Android device:
          1. Go to the **Summary** tab of this GitHub Actions run.
          2. Download the artifact named **`Jarvis7-debug-apk`**.
          3. Unzip and transfer **`Jarvis7-debug.apk`** to your Android device (Android 8.0+ / API 26+).
          4. Tap the file to install (enable *Install unknown apps* if prompted).
          EOF
